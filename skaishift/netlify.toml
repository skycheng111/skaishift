[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Tell browsers: always revalidate news.json, never serve stale cache
[[headers]]
  for = "/news.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/weekly-brief.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# JS/CSS assets are hashed by Vite so can be cached long-term
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
