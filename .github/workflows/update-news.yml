name: Daily News Pipeline

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: skaishift/scripts
        run: npm install

      - name: Run news pipeline
        working-directory: skaishift
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/update-news.js

      - name: Commit updated files
        run: |
          git config user.name "skAIshift Bot"
          git config user.email "bot@skaishift.com"
          git add skaishift/public/news.json skaishift/public/weekly-articles.json skaishift/public/last-week-articles.json skaishift/public/weekly-brief.json skaishift/public/slideshow-topic.json
          git diff --staged --quiet || git commit -m "Daily update $(date -u '+%Y-%m-%d')"
          git push

      - name: Build site
        working-directory: skaishift
        run: npm install && npm run build

      - name: Deploy to Netlify
        working-directory: skaishift
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          # Zip the dist directory and upload directly via Netlify API (most reliable method)
          cd dist && zip -r ../deploy.zip . && cd ..
          DEPLOY_RESPONSE=$(curl -s -X POST \
            "https://api.netlify.com/api/v1/sites/de55a3b6-f116-46f1-9d0a-0d84ce781de4/deploys" \
            -H "Authorization: Bearer $NETLIFY_AUTH_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @deploy.zip)
          echo "$DEPLOY_RESPONSE" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print('Deploy ID:', d.get('id'))
          print('State:', d.get('state'))
          print('URL:', d.get('deploy_ssl_url', d.get('ssl_url', '')))
          if d.get('state') not in ('ready', 'processing', 'uploading', 'uploaded', 'preparing'):
              print('ERROR:', d.get('error_message', 'Unknown error'))
              sys.exit(1)
          "
